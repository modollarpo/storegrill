services:
  db:
    image: postgres:16-alpine
    container_name: storegrill-db
    environment:
      POSTGRES_USER: storegrill
      POSTGRES_PASSWORD: storegrill
      POSTGRES_DB: storegrill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storegrill -d storegrill"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: storegrill-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storegrill
      MINIO_ROOT_PASSWORD: storegrill123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    container_name: storegrill-mail
    ports:
      - "1025:1025"
      - "8025:8025"

  cache:
    image: redis:7-alpine
    container_name: storegrill-cache
    ports:
      - "6379:6379"

  translate:
    image: libretranslate/libretranslate:latest
    container_name: storegrill-translate
    command: --load-only en,de,fr,es,it,ar,hi,pt
    environment:
      LT_UPDATE_MODELS: "true"
      LT_THREADS: "4"
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/languages || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  pgdata:
  miniodata:
