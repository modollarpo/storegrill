name: CI Quality Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: local
          POSTGRES_PASSWORD: local
          POSTGRES_DB: storegrill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local -d storegrill"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://local:local@localhost:5432/storegrill
      TEST_DATABASE_URL: postgresql://local:local@localhost:5432/storegrill
      AUTO_SCHEMA_SYNC: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build -w packages/shared

      - name: Generate Prisma Client
        run: npm run db:generate -w apps/api

      - name: Apply Migrations
        run: npm run db:deploy -w apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: UI Hygiene Gates
        run: npm run gate:ui

      - name: Lint
        run: npm run lint

      - name: Unit & Integration Tests
        run: npx vitest run --reporter=basic
